<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#FBF4D7">
  <title>Focus timer · Tasks HQ</title>
  <link rel="icon" href="icon-focus.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../tq.css?v=16">
  <link rel="stylesheet" href="tools.css?v=1">
  <script>try{if(localStorage.getItem("tq-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
</head>
<body class="tq-body" data-tool="focus">
  <main id="tq-lock" class="tq-lock" hidden>
    <form id="tq-lock-form" class="tq-lock-card" autocomplete="on">
      <img src="icon-focus.svg" alt="" width="52" height="52">
      <p class="tq-eyebrow">Tasks HQ</p>
      <h1>Focus timer</h1>
      <input type="text" name="username" value="nicky" autocomplete="username" hidden>
      <label for="tq-pw" class="tq-sr">Password</label>
      <input id="tq-pw" class="tq-input" type="password" placeholder="Password" autocomplete="current-password" required>
      <button class="tq-btn tq-btn-main" type="submit">Open</button>
      <button class="tq-btn tq-btn-soft tq-passkey" id="tq-passkey" type="button" hidden>👆 Use Touch ID / Face ID</button>
      <p id="tq-lock-msg" class="tq-lock-msg" role="alert"></p>
    </form>
  </main>
  <div id="tt-app" class="tq-app tt-app" hidden>
    <header class="tt-top">
      <a class="tt-back" href="../">← Tasks HQ</a>
      <button id="tt-theme" class="tq-btn tq-btn-soft" type="button">🌙 / ☀️</button>
    </header>
    <div class="tt-head"><img src="icon-focus.svg" alt="" width="56" height="56"><div><h1 id="tt-title">Focus timer</h1><p class="tq-sub">A timer that logs your focus time against a card or task.</p></div></div>
    <section id="tt-main" class="tt-main"></section>
  </div>
  <div id="tq-toast" class="tq-toast" role="status" hidden></div>
  <script src="../config.js?v=2"></script>
  <script src="../vendor/simplewebauthn-browser-13.3.0.umd.min.js"></script>
  <script src="../tq-auth.js?v=2"></script>
  <script src="../tq-fx.js?v=4"></script>
  <script src="tools.js?v=3"></script>
</body>
</html>
