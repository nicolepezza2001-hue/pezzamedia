<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#FBF4D7">
  <title>Jobs HQ · Pezza Media</title>
  <link rel="icon" href="../assets/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="hq.css?v=2">
</head>
<body>
  <main id="lock" class="lock">
    <form id="lock-form" class="lock-card" autocomplete="on">
      <img src="../assets/flower.png" alt="" width="56" height="56">
      <p class="eyebrow">Pezza Media · Jobs HQ</p>
      <h1>Private</h1>
      <input type="text" name="username" value="nicky" autocomplete="username" hidden>
      <label for="pw" class="sr">Password</label>
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
      <label class="remember"><input id="remember" type="checkbox" checked> Remember me on this device</label>
      <button class="btn" type="submit">Open</button>
      <p id="lock-msg" class="lock-msg" role="alert"></p>
    </form>
  </main>
  <div id="app" hidden></div>
  <script src="hq.js?v=4"></script>
</body>
</html>
