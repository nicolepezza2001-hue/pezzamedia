# Publishes the dist/ folder to GitHub Pages whenever main is updated
# (and after the snapshot helper adds images).
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Snapshot old WordPress site]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
