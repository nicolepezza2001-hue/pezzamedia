# Publishes the dist/ folder to GitHub Pages whenever main is updated
# (and after the snapshot helper adds images).
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Snapshot old WordPress site]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.first.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # GitHub sometimes can't see the just-uploaded artifact yet ("No artifacts named github-pages"),
      # so wait a moment and try the deploy again before giving up (2026-11-25).
      - run: sleep 15
      - id: first
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.first.outcome == 'failure'
        run: sleep 45
      - id: deployment
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
