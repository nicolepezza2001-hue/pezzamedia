# One-off helper for the move from WordPress.
# Downloads the old site at pezzamedia.com into old-site/ (for reference) and
# copies its images into dist/assets/ under readable names (tools/old-site-images.txt).
# Run it from the Actions tab ("Run workflow"). Safe to delete once the move is finished.
name: Snapshot old WordPress site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the old site for reference
        run: |
          rm -rf old-site && mkdir old-site && cd old-site
          wget --mirror --page-requisites --adjust-extension --no-parent \
               --span-hosts --domains=pezzamedia.com,fonts.googleapis.com,fonts.gstatic.com \
               -e robots=off --wait=0.2 --tries=3 --quiet https://pezzamedia.com/ || true
          wget -q -O home.raw.html https://pezzamedia.com/ || true
          find . -type f | sort > FILES.txt
      - name: Copy images into the new site
        run: |
          while read -r url name; do
            [ -z "$url" ] && continue
            [ -f "dist/assets/$name" ] && continue
            curl -fsSL --retry 3 -o "dist/assets/$name" "$url" || echo "MISSING $url"
          done < tools/old-site-images.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add old-site dist/assets
          git commit -m "Snapshot of the old WordPress site and its images" || echo "nothing new"
          git push
