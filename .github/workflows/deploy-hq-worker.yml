# Deploys the Tasks HQ Worker (hq-worker/) to Cloudflare whenever it changes on main.
# GitHub secrets: CLOUDFLARE_API_TOKEN (Cloudflare "Edit Cloudflare Workers" token), HQ_KEY (the HQ password),
# and optionally ANTHROPIC_API_KEY (for the instant comment fixes; skipped while it's not set).
name: Deploy Tasks HQ Worker

on:
  push:
    branches: [main]
    paths: ["hq-worker/**", ".github/workflows/deploy-hq-worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Worker packages
        working-directory: hq-worker
        run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: hq-worker
          wranglerVersion: "4.164.0"
          secrets: |
            KEY
        env:
          KEY: ${{ secrets.HQ_KEY }}
      - name: Add the Anthropic key to the Worker (only if it's set)
        working-directory: hq-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AK: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$AK" ]; then printf '%s' "$AK" | npx wrangler secret put ANTHROPIC_API_KEY; else echo "No ANTHROPIC_API_KEY secret yet, skipping."; fi
